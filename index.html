<style>
  :root{
    --bg:#FAF6F1; --card:#FFFFFF; --ink:#26211D; --ink-soft:#6B625A; --ink-faint:#9C9389;
    --line:#E8E0D6; --accent:#D9552B; --accent-ink:#FFFFFF; --accent-soft:#FBE3D9;
    --good:#2E7D4F; --good-soft:#DDEFE3; --mid:#B07A12; --mid-soft:#F6EAC8; --bad:#B53A2D; --bad-soft:#F6DCD7;
    --shadow:0 1px 2px rgba(38,33,29,.06),0 4px 14px rgba(38,33,29,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171412; --card:#221E1B; --ink:#F3EDE6; --ink-soft:#B3A99F; --ink-faint:#837A71;
      --line:#383129; --accent:#EE6B40; --accent-ink:#1B120E; --accent-soft:#40231A;
      --good:#6CC48C; --good-soft:#1E3326; --mid:#E2B24A; --mid-soft:#3A2F15; --bad:#EE7E70; --bad-soft:#3F211D;
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.4}
  h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0;letter-spacing:-.01em}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:var(--ink)}
  #app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
  .top h1{font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;min-width:40px;padding:0 10px;font-weight:600;font-size:14px}
  .btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px 18px;font-weight:600;width:100%}
  .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
  .btn.small{width:auto;padding:8px 14px;border-radius:10px;font-size:14px}
  .btn:disabled{opacity:.55}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
  .card.click{cursor:pointer}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--ink-soft);font-size:14px}
  .faint{color:var(--ink-faint);font-size:13px}
  .title{font-weight:600;font-size:17px}
  .stack{display:flex;flex-direction:column;gap:12px}
  label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=url],textarea{
    width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 13px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:80px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chips.scroll .chip{white-space:nowrap;flex:none}
  .tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
  .tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px;font-weight:600;color:var(--ink-soft)}
  .tabs button.on{background:var(--accent);color:var(--accent-ink)}
  .score{min-width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;flex:none}
  .score.good{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--mid-soft);color:var(--mid)}
  .score.bad{background:var(--bad-soft);color:var(--bad)} .score.none{background:var(--line);color:var(--ink-faint)}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600;margin:0 6px 6px 0}
  .tag.plain{background:var(--line);color:var(--ink-soft)}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
  .stat span{font-size:12.5px;color:var(--ink-soft)}
  .err{color:var(--bad);font-size:14px;min-height:20px}
  .ok{color:var(--good);font-size:14px}
  .center{text-align:center}
  .empty{text-align:center;color:var(--ink-soft);padding:36px 12px}
  .empty .big{font-size:42px;margin-bottom:6px}
  .fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:18px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(217,85,43,.4);z-index:6}
  .notarow{display:flex;align-items:center;gap:14px}
  .notarow .score{min-width:64px;height:64px;font-size:28px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px}
  .code{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;letter-spacing:.18em;font-weight:700;text-align:center;margin:10px 0}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
  .hint{font-size:13px;color:var(--mid);margin-top:6px}
  a{color:var(--accent)}
  hr{border:0;border-top:1px solid var(--line);margin:14px 0}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-size:44px;font-weight:700;color:var(--accent);text-align:center;margin:44px 0 4px}
  .map{height:260px;border-radius:14px;border:1px solid var(--line);z-index:0}
  .pin{background:none;border:0;font-size:28px;line-height:30px}
  .map.big{height:min(62vh,560px);min-height:320px}
  .mkwrap{background:none;border:0}
  .mk{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:2px solid var(--card);
    display:flex;align-items:center;justify-content:center;font:700 12px "Bricolage Grotesque",sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .mk.plan{background:var(--card);color:var(--accent);border:2px solid var(--accent);font-size:15px}
  .eu{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--card);box-shadow:0 0 0 6px rgba(120,120,120,.22)}
  .leaflet-container{background:var(--bg);font-family:Inter,system-ui,sans-serif}
  .leaflet-container .maplibregl-canvas{filter:sepia(.18) saturate(.9)}
  .mapa-escuro .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) sepia(.15) brightness(.88) contrast(.9)}
  .mapa-raster .leaflet-tile-pane{filter:grayscale(.85) contrast(.92) brightness(1.04)}
  .mapa-raster.mapa-escuro .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(.8) brightness(.8)}
  .leaflet-control-attribution{background:transparent !important;color:var(--ink-faint) !important;font-size:10px;padding:0 6px}
  .leaflet-control-attribution a{color:var(--ink-faint) !important}
  .leaflet-control.iconbtn{box-shadow:var(--shadow);margin:10px}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.22)}
  .leaflet-popup-tip{background:var(--card)}
  .leaflet-popup-content{margin:12px 14px;color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .leaflet-container a.leaflet-popup-close-button{color:var(--ink-soft)}
  .mais summary{cursor:pointer;font-weight:600;color:var(--ink-soft);padding:6px 0}
  .rev{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .rev:first-child{border-top:0;padding-top:0;margin-top:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

var SUPABASE_URL = "https://wyirmfuinpaaeodpbwcz.supabase.co";
var SUPABASE_KEY = "sb_publishable_yDuhiwR42Hwi2iWgKWSU3g_RmCvYwMS";
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var CATEGORIAS = [
  ["restaurante","🍽️","Restaurante"],["boteco","🍻","Boteco"],["bar","🍸","Bar"],["rodizio","🥩","Rodízio"],
  ["self_service","⚖️","Self-service / quilo"],["pf","🍛","PF / prato feito"],["pizzaria","🍕","Pizzaria"],
  ["hamburgueria","🍔","Hamburgueria"],["japones","🍣","Japonês"],["cafeteria","☕","Cafeteria / padaria"],
  ["acai","🍧","Açaí / sorveteria"],["doceria","🍰","Doceria"],["balada","🪩","Balada"],["show","🎤","Show / evento"],
  ["passeio","🌳","Parque / passeio"],["praia","🏖️","Praia"],["hotel","🏨","Hotel / pousada"],["outro","📍","Outro"]
];
var ATRIBUTOS = [
  ["estacionamento","Estacionamento"],["vr_va","Aceita VR/VA"],["pix","Aceita Pix"],["ifood","Tem no iFood"],["99food","Tem no 99Food"],["pet","Pet friendly"],
  ["crianca","Bom p/ criança"],["musica","Música ao vivo"],["reserva","Precisa reservar"],["fila","Costuma ter fila"],
  ["externa","Área externa"],["seguro","Seguro à noite"]
];
var CB_LABEL = {1:"Caro demais",2:"Meio caro",3:"Justo",4:"Bom preço",5:"Vale muito"};
var VOLTARIA = [["sim","Voltaria"],["talvez","Talvez"],["nunca_mais","Nunca mais"]];

var CAT = {}; CATEGORIAS.forEach(function(c){ CAT[c[0]] = c; });
var ATR = {}; ATRIBUTOS.forEach(function(a){ ATR[a[0]] = a[1]; });

var S = {
  user: null, grupos: [], grupo: null, membros: [], perfis: {}, lugares: [],
  admin: false, admBusca: "", admFiltro: "", authModo: "login", vista: lsGet("role_vista") === "mapa" ? "mapa" : "lista", aba: "ja_fomos", cat: "", busca: "", form: null
};

var app = document.getElementById("app");

/* ---------- utilidades ---------- */
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function $(id){ return document.getElementById(id); }
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k,v); } catch(e){} }
function fmtNota(n){ return n == null ? "–" : (Math.round(n*10)/10).toString().replace(".",","); }
function fmtMoney(n){ return n == null ? "–" : n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtData(d){ var p = String(d).split("-"); return p.length === 3 ? p[2]+"/"+p[1]+"/"+p[0] : d; }
function hoje(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function avg(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : null; }
function notaClasse(n){ return n == null ? "none" : n >= 8 ? "good" : n >= 6 ? "mid" : "bad"; }
function nomeDe(id){ return (S.perfis[id] && S.perfis[id].nome) || "Alguém"; }
function toast(msg){
  var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600);
}
function traduzErro(e){
  var m = (e && e.message) || String(e || "");
  if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/already registered/i.test(m)) return "Esse e-mail já tem conta. Tente entrar.";
  if (/Password should be/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if (/codigo invalido/i.test(m)) return "Código de convite inválido.";
  if (/Email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar.";
  if (/outro grupo usa/i.test(m)) return "Outro grupo usa este lugar, então não dá para mesclar por aqui.";
  if (/sem permissao/i.test(m)) return "Você não tem permissão para mesclar este lugar.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Sem conexão com a internet.";
  if (/rate limit/i.test(m)) return "Muitas tentativas. Espere um pouco e tente de novo.";
  return m;
}
function mapsUrl(l){
  if (l.maps_url && /^https?:\/\//i.test(l.maps_url)) return l.maps_url;
  if (l.lat != null && l.lng != null) return "https://www.google.com/maps/search/?api=1&query=" + l.lat + "," + l.lng;
  var q = [l.nome, l.bairro, l.cidade].filter(Boolean).join(" ");
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

/* ---------- estatísticas ---------- */
function stats(l){
  var vis = l.visitas || [];
  var avs = []; vis.forEach(function(v){ (v.avaliacoes||[]).forEach(function(a){ avs.push(a); }); });
  var gpp = vis.filter(function(v){ return v.gasto_total != null && v.num_pessoas; })
               .map(function(v){ return Number(v.gasto_total)/v.num_pessoas; });
  var cbs = avs.filter(function(a){ return a.custo_beneficio != null; }).map(function(a){ return a.custo_beneficio; });
  var com = avs.filter(function(a){ return a.voltaria; });
  return {
    nVisitas: vis.length,
    media: avg(avs.map(function(a){ return Number(a.nota); })),
    cb: avg(cbs),
    gastoPP: avg(gpp),
    voltam: com.filter(function(a){ return a.voltaria === "sim"; }).length,
    voltamTotal: com.length,
    nunca: com.some(function(a){ return a.voltaria === "nunca_mais"; })
  };
}

/* ---------- dados ---------- */
function carregarGrupos(){
  return sb.from("grupo_membros").select("papel, grupos(id,nome,tipo,codigo_convite)").eq("user_id", S.user.id)
    .then(function(r){
      if (r.error) throw r.error;
      S.grupos = (r.data||[]).filter(function(x){ return x.grupos; }).map(function(x){
        return { id:x.grupos.id, nome:x.grupos.nome, tipo:x.grupos.tipo, codigo:x.grupos.codigo_convite, papel:x.papel };
      });
    });
}
function carregarGrupo(id){
  var g = S.grupos.filter(function(x){ return x.id === id; })[0];
  if (!g) return Promise.reject(new Error("Grupo não encontrado"));
  S.grupo = g;
  return Promise.all([
    sb.from("lugares").select("*, locais(*), visitas(*, avaliacoes(*))").eq("grupo_id", id).order("created_at",{ascending:false}),
    sb.from("grupo_membros").select("user_id,papel").eq("grupo_id", id),
    sb.from("perfis").select("id,nome")
  ]).then(function(rs){
    rs.forEach(function(r){ if (r.error) throw r.error; });
    S.lugares = (rs[0].data || []).map(function(l){
      var lo = l.locais || {};
      l.nome = lo.nome; l.categoria = lo.categoria; l.bairro = lo.bairro; l.cidade = lo.cidade;
      l.lat = lo.lat; l.lng = lo.lng; l.precisao = lo.precisao; l.local_criado_por = lo.criado_por; l.privado = !!lo.privado; l.endereco = lo.endereco; l.numero = lo.numero;
      return l;
    });
    S.membros = rs[1].data || [];
    S.perfis = {}; (rs[2].data||[]).forEach(function(p){ S.perfis[p.id] = p; });
  });
}
function lugarPorId(id){ return S.lugares.filter(function(l){ return l.id === id; })[0]; }

/* ---------- roteamento ---------- */
function go(h){ if (location.hash === h) route(); else location.hash = h; }
function route(){
  limparMapaGrupo();
  if (!S.user) return viewAuth();
  var p = (location.hash || "").replace(/^#\/?/, "").split("/");
  var r = p[0] || "";
  if (r === "admin"){
    if (p[1] === "local" && p[2]) return viewAdminLocal(p[2]);
    return viewAdmin();
  }
  if (r === "g" && p[1]){
    var gid = p[1];
    var pronto = (S.grupo && S.grupo.id === gid) ? Promise.resolve() : (app.innerHTML = '<p class="empty">Carregando…</p>', carregarGrupo(gid));
    pronto.then(function(){
      lsSet("role_grupo", gid);
      var sub = p[2] || "";
      if (sub === "lugar" && p[3]) return viewLugar(p[3]);
      if (sub === "novo") return viewFormLugar(null);
      if (sub === "editar" && p[3]) return viewFormLugar(p[3]);
      if (sub === "visita" && p[3]) return viewFormVisita(p[3], p[4] || null);
      viewLista();
    }).catch(function(e){ toast(traduzErro(e)); go("#/grupos"); });
    return;
  }
  viewGrupos();
}
window.addEventListener("hashchange", route);

/* ---------- auth ---------- */
function viewAuth(){
  var cad = S.authModo === "cadastro";
  app.innerHTML =
    '<div class="brand">Rolê</div>' +
    '<p class="center muted" style="margin:0 0 26px">Onde vocês foram, o que acharam e se voltariam.</p>' +
    '<div class="stack">' +
      (cad ? '<div><label class="f" for="aNome">Seu nome</label><input type="text" id="aNome" autocomplete="name"></div>' : '') +
      '<div><label class="f" for="aEmail">E-mail</label><input type="email" id="aEmail" autocomplete="email" inputmode="email"></div>' +
      '<div><label class="f" for="aSenha">Senha</label><input type="password" id="aSenha" autocomplete="' + (cad ? "new-password" : "current-password") + '"></div>' +
      '<div class="err" id="aErr"></div>' +
      '<button class="btn" id="aOk" data-act="auth">' + (cad ? "Criar conta" : "Entrar") + '</button>' +
      '<button class="btn sec" data-act="authModo">' + (cad ? "Já tenho conta" : "Criar uma conta") + '</button>' +
    '</div>';
}
function fazerAuth(){
  var email = $("aEmail").value.trim(), senha = $("aSenha").value, nome = $("aNome") ? $("aNome").value.trim() : "";
  var err = $("aErr"); err.className = "err"; err.textContent = "";
  if (!email || !senha){ err.textContent = "Preencha e-mail e senha."; return; }
  if (S.authModo === "cadastro" && !nome){ err.textContent = "Diga seu nome."; return; }
  $("aOk").disabled = true;
  var op = S.authModo === "cadastro"
    ? sb.auth.signUp({ email: email, password: senha, options: { data: { full_name: nome } } })
    : sb.auth.signInWithPassword({ email: email, password: senha });
  op.then(function(r){
    $("aOk").disabled = false;
    if (r.error){ err.textContent = traduzErro(r.error); return; }
    if (S.authModo === "cadastro" && !r.data.session){
      err.className = "ok"; err.textContent = "Conta criada! Confirme seu e-mail e depois entre.";
    }
  });
}

/* ---------- grupos ---------- */
function viewGrupos(){
  var nome = S.perfis[S.user.id] ? S.perfis[S.user.id].nome : (S.user.user_metadata && S.user.user_metadata.full_name) || "";

  if (nome) h += '<p class="muted" style="margin-top:0">Olá, ' + esc(nome) + '!</p>';
  if (!S.grupos.length){
    h += '<div class="empty"><div class="big">👫</div>Crie um grupo para o casal ou os amigos,<br>ou entre com um código de convite.</div>';
  }
  S.grupos.forEach(function(g){
    h += '<div class="card click" data-act="abrirGrupo" data-id="' + esc(g.id) + '"><div class="row"><div class="grow">' +
      '<div class="title">' + esc(g.nome) + '</div><div class="faint">' + (g.tipo === "casal" ? "Casal" : "Amigos") + '</div></div><span>›</span></div></div>';
  });
  h += '<hr><div class="stack">' +
    '<button class="btn" data-act="sheetCriar">Criar grupo</button>' +
    '<button class="btn sec" data-act="sheetEntrar">Entrar com código</button>' +
    (S.admin ? '<button class="btn sec" data-act="admin">🛠️ Catálogo (admin)</button>' : '') + '</div>';
  app.innerHTML = h;
  if (S.grupos.length === 1 && !S._grupoAuto){ S._grupoAuto = true; go("#/g/" + S.grupos[0].id); }
}
function abrirSheet(html){
  fecharSheet();
  var bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet";
  bg.innerHTML = '<div class="sheet">' + html + '</div>';
  bg.addEventListener("click", function(e){ if (e.target === bg) fecharSheet(); });
  document.body.appendChild(bg);
}
function fecharSheet(){ var s = $("sheet"); if (s) s.remove(); }
function sheetCriar(){
  S.sheetTipo = "casal";
  abrirSheet('<h2 style="margin-bottom:12px">Novo grupo</h2><div class="stack">' +
    '<div><label class="f" for="gNome">Nome do grupo</label><input type="text" id="gNome" maxlength="60" placeholder="Ex.: Os facheros"></div>' +
    '<div><label class="f">Tipo</label><div class="chips" id="gTipo">' +
      '<button class="chip on" data-act="gTipo" data-v="casal">Casal</button><button class="chip" data-act="gTipo" data-v="amigos">Amigos</button></div></div>' +
    '<div class="err" id="gErr"></div><button class="btn" id="gOk" data-act="criarGrupo">Criar</button></div>');
  $("gNome").focus();
}
function sheetEntrar(){
  abrirSheet('<h2 style="margin-bottom:12px">Entrar em um grupo</h2><div class="stack">' +
    '<div><label class="f" for="gCod">Código de convite</label><input type="text" id="gCod" maxlength="6" autocapitalize="characters" placeholder="ABC123"></div>' +
    '<div class="err" id="gErr"></div><button class="btn" id="gOk" data-act="entrarGrupo">Entrar</button></div>');
  $("gCod").focus();
}
function criarGrupo(){
  var nome = $("gNome").value.trim();
  if (!nome){ $("gErr").textContent = "Dê um nome ao grupo."; return; }
  $("gOk").disabled = true;
  sb.rpc("criar_grupo", { p_nome: nome, p_tipo: S.sheetTipo }).then(function(r){
    if (r.error){ $("gOk").disabled = false; $("gErr").textContent = traduzErro(r.error); return; }
    fecharSheet();
    carregarGrupos().then(function(){ S.grupo = null; go("#/g/" + r.data); });
  });
}
function entrarGrupo(codigo, silencioso){
  return sb.rpc("entrar_grupo", { p_codigo: codigo }).then(function(r){
    if (r.error){
      if (silencioso){ toast(traduzErro(r.error)); return null; }
      $("gOk").disabled = false; $("gErr").textContent = traduzErro(r.error); return null;
    }
    fecharSheet();
    return carregarGrupos().then(function(){ S.grupo = null; go("#/g/" + r.data); });
  });
}

function renderCards(){

/* ---------- base de mapa minimalista (CARTO claro/escuro, sem chave) ---------- */
function criarMapa(el, centro, zoom){
  var m = L.map(el, { zoomControl: false, attributionControl: false }).setView(centro, zoom);
  var escuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var cont = m.getContainer(); if (escuro) cont.classList.add("mapa-escuro");
  var base = "© OpenStreetMap";
  if (window.maplibregl && L.maplibreGL){
    // estilo vetorial minimalista e gratuito (OpenFreeMap), sem chave de API
    L.maplibreGL({ style: "https://tiles.openfreemap.org/styles/positron" }).addTo(m);
    base = "OpenFreeMap © OpenMapTiles, dados © OpenStreetMap";
  } else {
    cont.classList.add("mapa-raster");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(m);
  }
  L.control.attribution({ prefix: false }).addAttribution(base).addTo(m);
  return m;
}

/* ---------- mapa do grupo ---------- */
function limparMapaGrupo(){
  if (S.mapaG){ S.mapaG.remove(); S.mapaG = null; S.mapaMarcas = null; S.mapaEu = null; }
}
function marcadorLugar(l, st){
  var plan = l.estado === "quero_ir";
  return L.marker([l.lat, l.lng], { icon: L.divIcon({
    className: "mkwrap", html: '<div class="mk' + (plan ? " plan" : "") + '">' + (plan ? "☆" : fmtNota(st.media)) + "</div>",
    iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -16] }) });
}
function popupLugar(l, st){
  var box = document.createElement("div");
  var c = CAT[l.categoria] || CAT.outro;
  box.innerHTML = '<b>' + esc(l.nome) + '</b><div style="color:var(--ink-soft);font-size:13px;margin:2px 0 8px">' +
    [c[1] + " " + c[2], l.bairro].filter(Boolean).map(esc).join(" · ") +
    (l.estado === "ja_fomos" ? " · nota " + fmtNota(st.media) : " · quero ir") + "</div>";
  var b = document.createElement("button");
  b.className = "btn small"; b.textContent = "Abrir";
  b.addEventListener("click", function(){ go("#/g/" + S.grupo.id + "/lugar/" + l.id); });
  box.appendChild(b);
  return box;
}
function renderMapa(lista){
  var box = $("cards");
  if (!window.L){ box.innerHTML = '<div class="empty">Mapa indisponível agora.</div>'; return; }
  var comLoc = lista.filter(function(x){ return x.l.lat != null && x.l.lng != null; });
  if (!S.mapaG || !box.contains(S.mapaG.getContainer())){
    limparMapaGrupo();
    box.innerHTML = '<div id="mapaGrupo" class="map big"></div>' +
      '<div class="faint" id="mapaInfo" style="margin-top:8px;padding-right:120px"></div>';
    var u = null; try { u = JSON.parse(lsGet("role_ultimo") || "null"); } catch(e){}
    S.mapaG = criarMapa("mapaGrupo", u || [-14.2, -51.9], u ? 12 : 4);
    S.mapaMarcas = L.layerGroup().addTo(S.mapaG);
    var ctl = L.control({ position: "topright" });
    ctl.onAdd = function(){
      var b = L.DomUtil.create("button", "iconbtn"); b.type = "button"; b.textContent = "📍 Onde estou";
      L.DomEvent.disableClickPropagation(b);
      L.DomEvent.on(b, "click", mapaOndeEstou);
      return b;
    };
    ctl.addTo(S.mapaG);
  }
  S.mapaMarcas.clearLayers();
  comLoc.forEach(function(x){ marcadorLugar(x.l, x.s).bindPopup(popupLugar(x.l, x.s)).addTo(S.mapaMarcas); });
  if (comLoc.length === 1) S.mapaG.setView([comLoc[0].l.lat, comLoc[0].l.lng], 16);
  else if (comLoc.length > 1) S.mapaG.fitBounds(L.latLngBounds(comLoc.map(function(x){ return [x.l.lat, x.l.lng]; })), { padding: [40, 40], maxZoom: 17 });
  var sem = lista.length - comLoc.length;
  $("mapaInfo").textContent = comLoc.length + (comLoc.length === 1 ? " lugar no mapa" : " lugares no mapa") +
    (sem ? " · " + sem + " sem localização (edite o lugar para marcar)" : "");
}
function mapaOndeEstou(){
  pedirLocalizacao(function(){
    if (!S.mapaG) return;
    if (GEO.lat == null){ toast("Não consegui sua localização. Permita o acesso no navegador."); return; }
    if (S.mapaEu) S.mapaEu.remove();
    S.mapaEu = L.marker([GEO.lat, GEO.lng], { interactive: false, icon: L.divIcon({ className: "mkwrap", html: '<div class="eu"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(S.mapaG);
    S.mapaG.setView([GEO.lat, GEO.lng], Math.max(S.mapaG.getZoom(), 15));
  });
}

/* ---------- formulário de lugar (catálogo comunitário) ---------- */
var GEO = { lat: null, lng: null, estado: "idle" };
var buscaSeq = 0, buscaTimer = null;

function pedirLocalizacao(depois){
  if (!navigator.geolocation){ GEO.estado = "negado"; atualizarStatusLoc(); if (depois) depois(); return; }
  GEO.estado = "buscando"; atualizarStatusLoc();
  navigator.geolocation.getCurrentPosition(function(p){
    GEO.lat = p.coords.latitude; GEO.lng = p.coords.longitude; GEO.estado = "ok";
    lsSet("role_ultimo", JSON.stringify([GEO.lat, GEO.lng]));
    atualizarStatusLoc(); if (depois) depois();
  }, function(){
    GEO.estado = "negado"; atualizarStatusLoc(); if (depois) depois();
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}
function atualizarStatusLoc(){
  var el = $("locStatus"); if (!el) return;
  el.textContent = GEO.estado === "ok" ? "📍 Usando sua localização atual"
    : GEO.estado === "buscando" ? "Localizando…"
    : GEO.estado === "negado" ? "Sem localização. Busque pelo nome." : "";
}

/* geocodificação gratuita (Nominatim/OpenStreetMap): cidade pela localização atual e coordenadas pelo endereço */
var revCache = {};
function fetchComTimeout(url, ms){
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var t = setTimeout(function(){ if (ctl) ctl.abort(); }, ms);
  return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function(r){ clearTimeout(t); return r; }, function(e){ clearTimeout(t); throw e; });
}
function geocodeReverso(lat, lng){
  var k = lat.toFixed(4) + "," + lng.toFixed(4);
  if (revCache[k]) return Promise.resolve(revCache[k]);
  return fetchComTimeout("https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=pt-BR&lat=" + lat + "&lon=" + lng, 7000)
    .then(function(r){ return r.json(); }).then(function(j){
      var a = (j && j.address) || {};
      var o = { cidade: a.city || a.town || a.village || a.municipality || a.county || "",
        bairro: a.suburb || a.neighbourhood || a.city_district || "", rua: a.road || "", numero: a.house_number || "" };
      revCache[k] = o; return o;
    }).catch(function(){ return null; });
}
function geocodeEndereco(endereco, cidade){
  var q = [endereco, cidade].filter(Boolean).join(", ");
  return fetchComTimeout("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&accept-language=pt-BR&q=" + encodeURIComponent(q), 7000)
    .then(function(r){ return r.json(); }).then(function(a){
      if (!a || !a[0]) return null;
      var ad = a[0].address || {};
      return { lat: parseFloat(a[0].lat), lng: parseFloat(a[0].lon),
        cidade: ad.city || ad.town || ad.village || ad.municipality || ad.county || "" };
    }).catch(function(){ return null; });
}
function distM(lat1, lng1, lat2, lng2){
  var R = 6371000, rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}

function queryEnd(rua, numero){
  rua = (rua || "").trim(); numero = (numero || "").trim();
  return rua ? rua + (numero ? ", " + numero : "") : "";
}
function fmtEnd(x){ return queryEnd(x.endereco, x.numero); }
var geoTimer = null;
function agendarGeocode(){ clearTimeout(geoTimer); geoTimer = setTimeout(geocodificarForm, 900); }
function geocodificarForm(){
  var f = S.form;
  if (!f || (f.modo !== "novo" && f.modo !== "editar" && f.modo !== "admin")) return Promise.resolve();
  var cidade = (($("fCidade") ? $("fCidade").value : f.cidade) || "").trim();
  var q = queryEnd(f.endereco, f.numero);
  if (!q || !cidade || q === f.geoQuery) return Promise.resolve();
  f.geoQuery = q;
  var hint = $("mapHint"); if (hint) hint.textContent = "Procurando no mapa…";
  return geocodeEndereco(q, cidade).then(function(g){
    if (S.form !== f) return;
    if (g && g.cidade){
      var a = norm(g.cidade), b = norm(cidade);
      if (a !== b && a.indexOf(b) < 0 && b.indexOf(a) < 0) g = null;
    }
    if (!g){ if (hint) hint.textContent = "Não achei esse endereço em " + cidade + ". Confira a grafia da rua ou arraste o pin até o lugar certo."; return; }
    if (hint) hint.textContent = "Confira o pin e arraste se precisar ajustar.";

    if (seq !== buscaSeq || !S.form || S.form.modo !== "busca") return;
    f.sugs = r.error ? [] : (r.data || []);

function renderSugs(){

function pickLocal(id){

function novoLocal(){

/* mapa para marcar/ajustar o pin (OpenStreetMap + Leaflet) */
function montarMapa(){
  var el = $("mapa"), f = S.form;
  if (!window.L){ el.innerHTML = '<p class="faint" style="padding:12px">Mapa indisponível agora. Você pode salvar sem localização.</p>'; return; }
  var centro, zoom = 16, u = null;
  try { u = JSON.parse(lsGet("role_ultimo") || "null"); } catch(e){}
  if (f.lat != null) centro = [f.lat, f.lng];
  else if (GEO.lat != null) centro = [GEO.lat, GEO.lng];
  else if (u) centro = u;
  else { centro = [-14.2, -51.9]; zoom = 4; }
  S.map = criarMapa(el, centro, f.lat != null ? 17 : zoom);
  S.map.on("click", function(e){ colocarPin(e.latlng.lat, e.latlng.lng, "ajustada"); });
  if (f.lat != null) colocarPin(f.lat, f.lng, f.precisao, true);
  atualizarMapStatus();
}
function colocarPin(lat, lng, prec, semCentrar){
  var f = S.form; if (!S.map) return;
  f.lat = lat; f.lng = lng; f.precisao = prec;
  if (!S.pin){
    S.pin = L.marker([lat, lng], { draggable: true, icon: L.divIcon({ html: '<div class="mk" style="width:26px;height:26px"></div>', className: "mkwrap", iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(S.map);
    S.pin.on("dragend", function(){ var p = S.pin.getLatLng(); colocarPin(p.lat, p.lng, "ajustada", true); });
  } else S.pin.setLatLng([lat, lng]);
  if (!semCentrar) S.map.setView([lat, lng], Math.max(S.map.getZoom(), 17));
  atualizarMapStatus();
}
function atualizarMapStatus(){
  var el = $("mapStatus"), f = S.form; if (!el) return;
  el.textContent = f.lat == null ? "Sem localização marcada" : f.precisao === "gps" ? "📍 Marcado pelo GPS" : f.precisao === "endereco" ? "📍 Marcado pelo endereço" : "📍 Marcado por você";
}
function usarLocalizacao(){
  pedirLocalizacao(function(){
    var f = S.form; if (!f) return;
    if (f.modo === "busca") buscarLocais();
    else if (S.map && GEO.lat != null) colocarPin(GEO.lat, GEO.lng, "gps");
    else if (GEO.estado === "negado") toast("Não consegui sua localização. Permita o acesso no navegador.");
  });
}

function salvarLugar(){
  var f = S.form, err = $("fErr"); err.textContent = "";
  var maps = $("fMaps") ? $("fMaps").value.trim() : "";
  if (maps && !/^https?:\/\//i.test(maps)){ err.textContent = "O link precisa começar com http:// ou https://"; return; }
  var grupoPay = { estado: f.estado, atributos: f.atributos, maps_url: maps || null };
  var editaLocal = f.modo === "novo" || f.modo === "admin" || (f.modo === "editar" && f.editavelLocal);
  var nome = "", endereco = "", numero = "", cidade = "";
  if (editaLocal){
    nome = $("fNome").value.trim();
    if (!nome){ err.textContent = "O nome é obrigatório."; return; }
    endereco = $("fEndereco").value.trim();
    numero = $("fNumero").value.trim();
    f.endereco = endereco; f.numero = numero;
    cidade = ($("fCidade") ? $("fCidade").value : f.cidade).trim();
    if (cidade) lsSet("role_cidade", cidade);
  }
  var btn = $("fOk"); btn.disabled = true; btn.textContent = "Salvando…";
  var novo = f.modo !== "editar", compartilhado = false;

  // o endereço digitado refina a posição quando o GPS não bate (ex.: cadastrou de casa) ou não existe
  var refinar = editaLocal ? geocodificarForm() : Promise.resolve();
  refinar.then(function(){
    var local = editaLocal ? { nome: nome, categoria: f.categoria, bairro: f.bairro || null, cidade: cidade || null, endereco: endereco || null, numero: numero || null,
      lat: f.lat, lng: f.lng, precisao: f.lat == null ? "desconhecida" : f.precisao, privado: !!f.privado } : null;
    if (f.modo === "novo"){
      return sb.from("locais").insert(local).select().single().then(function(r){
        if (r.error) throw r.error;
        return sb.from("lugares").insert(Object.assign({ grupo_id: S.grupo.id, local_id: r.data.id }, grupoPay)).select().single();
      });
    }
    if (f.modo === "admin"){
      return sb.from("locais").update(local).eq("id", f.localId).select().then(function(r){
        if (r.error) throw r.error;
        if (!r.data || !r.data.length) throw new Error("Sem permissão para editar este lugar.");
        return { admin: true };
      });
    }
    if (f.modo === "existente"){
      return sb.from("lugares").insert(Object.assign({ grupo_id: S.grupo.id, local_id: f.local.id }, grupoPay)).select().single();
    }
    return (editaLocal ? sb.from("locais").update(local).eq("id", f.localId).select() : Promise.resolve({ data: [1] })).then(function(r){
      if (r.error) throw r.error;
      if (!r.data || !r.data.length) compartilhado = true;
      return sb.from("lugares").update(grupoPay).eq("id", f.id).select().single();
    });
  }).then(function(r){
    if (r.error) throw r.error;
    if (r.admin){ toast("Salvo no catálogo."); return go("#/admin"); }
    var destino = r.data.id;
    return carregarGrupo(S.grupo.id).then(function(){
      if (compartilhado) toast("Nome e endereço não mudaram: outro grupo usa este lugar.");
      if (novo && grupoPay.estado === "ja_fomos") go("#/g/" + S.grupo.id + "/visita/" + destino);
      else go("#/g/" + S.grupo.id + "/lugar/" + destino);
    });
  }).catch(function(e){
    btn.disabled = false; btn.textContent = "Salvar";
    err.textContent = (e && e.code === "23505") ? "Esse lugar já está no seu grupo." : traduzErro(e);
  });
}
function apagarLugar(){
  var l = lugarPorId(S.form.id);
  if (!confirm("Remover \"" + l.nome + "\" do grupo? As visitas e avaliações dele neste grupo serão apagadas. O lugar continua no catálogo.")) return;
  sb.from("lugares").delete().eq("id", l.id).then(function(r){
    if (r.error){ toast(traduzErro(r.error)); return; }
    carregarGrupo(S.grupo.id).then(function(){ go("#/g/" + S.grupo.id); });
  });
}

var admTimer = null, admSeq = 0;
function viewAdmin(){

  });

function carregarAdmin(){
  var el = $("admLista"); if (!el) return;
  var q = (S.admBusca || "").trim().replace(/[%_,()*]/g, ""), seq = ++admSeq;
  var qb = sb.from("locais").select("id,nome,categoria,bairro,cidade,endereco,numero,lat,lng,privado")
    .eq("status", "ativo").order("created_at", { ascending: false }).limit(60);
  if (q) qb = qb.ilike("nome", "%" + q + "%");
  if (S.admFiltro === "sem_end") qb = qb.is("endereco", null);
  if (S.admFiltro === "sem_loc") qb = qb.is("lat", null);
  qb.then(function(r){
    if (seq !== admSeq || !$("admLista")) return;
    if (r.error){ el.innerHTML = '<div class="err">' + esc(traduzErro(r.error)) + '</div>'; return; }
    var lista = r.data || [];
    if (!lista.length){ el.innerHTML = '<div class="empty">Nenhum lugar encontrado.</div>'; return; }
    el.innerHTML = lista.map(function(x){
      var faltas = [];
      if (!x.endereco) faltas.push("sem endereço");
      if (x.lat == null) faltas.push("sem localização");
      if (x.privado) faltas.push("privado");
      return '<div class="card click" data-act="abrirAdminLocal" data-id="' + esc(x.id) + '"><div class="title">' + esc(x.nome) + '</div>' +
        '<div class="muted">' + resumoLocal(x) + '</div>' +
        (fmtEnd(x) ? '<div class="faint">' + esc(fmtEnd(x)) + '</div>' : '') +
        (faltas.length ? '<div class="faint" style="color:var(--mid)">' + esc(faltas.join(" · ")) + '</div>' : '') + '</div>';
    }).join("") + (lista.length === 60 ? '<div class="faint center">Mostrando os 60 mais recentes. Use a busca para filtrar.</div>' : "");
  });
}

    S.form = { modo: "admin", localId: id, nome: l.nome, categoria: l.categoria, bairro: l.bairro || "", cidade: l.cidade || "",
      endereco: l.endereco || "", numero: l.numero || "", geoQuery: queryEnd(l.endereco, l.numero), lat: l.lat, lng: l.lng, precisao: l.precisao,
      estado: "ja_fomos", atributos: [], maps: "", privado: !!l.privado, editavelLocal: true };
    renderForm();
  });
}
function excluirLocalAdmin(){
  var f = S.form;
  if (!confirm("Excluir \"" + f.nome + "\" do catálogo? Só é possível se nenhum grupo usa este lugar.")) return;
  sb.from("locais").delete().eq("id", f.localId).select().then(function(r){
    if (r.error){
      toast(r.error.code === "23503" ? "Algum grupo usa este lugar. Mescle com outro em vez de excluir." : traduzErro(r.error));
      return;
    }
    toast("Excluído do catálogo."); go("#/admin");
  });
}

/* ---------- mesclar duplicados ---------- */
var mesclaTimer = null, mesclaSeq = 0;
function abrirMesclar(){
  var f = S.form; S.mesclaSugs = [];
  abrirSheet('<h2 style="margin-bottom:6px">Mesclar duplicado</h2>' +
    '<p class="muted" style="margin-top:0">Procure o lugar correto. As visitas e avaliações de "' + esc(f.nome) + '" serão movidas para ele e este deixa de aparecer.</p>' +
    '<input type="text" id="mBusca" placeholder="Nome do lugar correto" autocomplete="off"><div id="mRes" style="margin-top:10px"></div>');
  $("mBusca").focus();
  $("mBusca").addEventListener("input", function(){
    clearTimeout(mesclaTimer);
    mesclaTimer = setTimeout(function(){
      var q = $("mBusca") ? $("mBusca").value.trim() : "", seq = ++mesclaSeq;
      if (q.length < 2){ $("mRes").innerHTML = ""; return; }
      sb.rpc("buscar_locais", { p_nome: q, p_lat: null, p_lng: null, p_raio: 100000 }).then(function(r){
        if (seq !== mesclaSeq || !$("mRes")) return;
        S.mesclaSugs = (r.data || []).filter(function(x){ return x.id !== f.localId; });
        $("mRes").innerHTML = S.mesclaSugs.length ? S.mesclaSugs.map(function(x){
          return '<div class="card click" data-act="mesclarPara" data-id="' + esc(x.id) + '"><div class="title">' + esc(x.nome) + '</div><div class="muted">' + resumoLocal(x) + '</div></div>';
        }).join("") : '<div class="faint">Nada encontrado.</div>';
      });
    }, 300);
  });
}
function mesclarPara(destinoId){
  var f = S.form, x = (S.mesclaSugs || []).filter(function(s){ return s.id === destinoId; })[0]; if (!x) return;
  if (!confirm("Mover tudo de \"" + f.nome + "\" para \"" + x.nome + "\"? Isso não dá para desfazer.")) return;
  sb.rpc("mesclar_locais", { p_origem: f.localId, p_destino: destinoId }).then(function(r){
    if (r.error){ toast(traduzErro(r.error)); return; }
    fecharSheet();
    if (f.modo === "admin"){ toast("Lugares mesclados."); return go("#/admin"); }
    carregarGrupo(S.grupo.id).then(function(){
      var l = S.lugares.filter(function(z){ return z.local_id === destinoId; })[0];
      toast("Lugares mesclados.");
      go(l ? "#/g/" + S.grupo.id + "/lugar/" + l.id : "#/g/" + S.grupo.id);
    });
  });
}

/* ---------- formulário de visita + avaliação ---------- */
function viewFormVisita(lugarId, visitaId){
  var l = lugarPorId(lugarId);
  if (!l) return go("#/g/" + S.grupo.id);
  var v = visitaId ? (l.visitas||[]).filter(function(x){ return x.id === visitaId; })[0] : null;
  if (visitaId && !v) return go("#/g/" + S.grupo.id + "/lugar/" + lugarId);
  var minha = v ? (v.avaliacoes||[]).filter(function(a){ return a.user_id === S.user.id; })[0] : null;
  S.form = {
    lugarId: lugarId, visitaId: visitaId,
    cb: minha ? minha.custo_beneficio : null, voltaria: minha ? minha.voltaria : null
  };
  var nota = minha ? Number(minha.nota) : 8;
  var h = '<div class="top"><button class="iconbtn" data-act="voltar">‹</button><h1>' + esc(l.nome) + '</h1></div><div class="stack">' +
    '<div class="row"><div class="grow"><label class="f" for="vData">Data</label><input type="date" id="vData" max="' + hoje() + '" value="' + esc(v ? v.data : hoje()) + '"></div>' +
      '<div class="grow"><label class="f" for="vPessoas">Pessoas</label><input type="number" id="vPessoas" min="1" max="99" inputmode="numeric" value="' + (v && v.num_pessoas ? v.num_pessoas : (S.membros.length || 2)) + '"></div></div>' +
    '<div><label class="f" for="vGasto">Quanto gastaram no total (R$)</label><input type="number" id="vGasto" min="0" step="0.01" inputmode="decimal" placeholder="Opcional" value="' + (v && v.gasto_total != null ? v.gasto_total : "") + '"></div>' +
    '<hr style="margin:2px 0"><h3>Sua avaliação</h3>' +
    '<div class="notarow"><div class="score ' + notaClasse(nota) + '" id="notaBox">' + fmtNota(nota) + '</div>' +
      '<div class="grow"><input type="range" id="vNota" min="0" max="10" step="0.5" value="' + nota + '"></div></div>' +
    '<div><label class="f">Custo-benefício</label><div class="chips" id="gCb">' +
      [1,2,3,4,5].map(function(n){ return '<button class="chip ' + (S.form.cb === n ? "on" : "") + '" data-act="fSingle" data-g="cb" data-v="' + n + '">' + n + ' · ' + esc(CB_LABEL[n]) + '</button>'; }).join("") + '</div></div>' +
    '<div><label class="f">Voltaria?</label><div class="chips" id="gVoltaria">' +
      VOLTARIA.map(function(x){ return '<button class="chip ' + (S.form.voltaria === x[0] ? "on" : "") + '" data-act="fSingle" data-g="voltaria" data-v="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join("") + '</div></div>' +
    '<div><label class="f" for="vPedidos">O que pediram</label><input type="text" id="vPedidos" maxlength="200" value="' + esc(minha ? minha.pedidos : "") + '"></div>' +
    '<div><label class="f" for="vCom">Comentário</label><textarea id="vCom" maxlength="1000">' + esc(minha ? minha.comentario : "") + '</textarea></div>' +
    '<div class="err" id="fErr"></div>' +
    '<button class="btn" id="fOk" data-act="salvarVisita">Salvar</button>' +
    (v ? '<button class="btn danger" data-act="apagarVisita">Apagar esta visita</button>' : '') + '</div>';
  app.innerHTML = h;
  $("vNota").addEventListener("input", function(e){
    var n = Number(e.target.value), b = $("notaBox");
    b.textContent = fmtNota(n); b.className = "score " + notaClasse(n);
  });
}
function salvarVisita(){
  var f = S.form, l = lugarPorId(f.lugarId);
  var data = $("vData").value, gasto = $("vGasto").value, pessoas = $("vPessoas").value;
  if (!data){ $("fErr").textContent = "Escolha a data."; return; }
  var vis = {
    data: data,
    gasto_total: gasto === "" ? null : Number(gasto),
    num_pessoas: pessoas === "" ? null : parseInt(pessoas, 10)
  };
  var av = {
    nota: Number($("vNota").value), custo_beneficio: f.cb || null, voltaria: f.voltaria || null,
    pedidos: $("vPedidos").value.trim() || null, comentario: $("vCom").value.trim() || null
  };
  $("fOk").disabled = true; $("fErr").textContent = "";
  var pVisita = f.visitaId
    ? sb.from("visitas").update(vis).eq("id", f.visitaId).select().single()
    : sb.from("visitas").insert(Object.assign({ lugar_id: f.lugarId }, vis)).select().single();
  pVisita.then(function(r){
    if (r.error) throw r.error;
    av.visita_id = r.data.id; av.user_id = S.user.id;
    return sb.from("avaliacoes").upsert(av, { onConflict: "visita_id,user_id" });
  }).then(function(r){
    if (r.error) throw r.error;
    return l.estado === "ja_fomos" ? null : sb.from("lugares").update({ estado: "ja_fomos" }).eq("id", f.lugarId);
  }).then(function(){
    return carregarGrupo(S.grupo.id);
  }).then(function(){
    S.aba = "ja_fomos";
    go("#/g/" + S.grupo.id + "/lugar/" + f.lugarId);
  }).catch(function(e){
    $("fOk").disabled = false; $("fErr").textContent = traduzErro(e);
  });
}
function apagarVisita(){
  if (!confirm("Apagar esta visita e as avaliações dela?")) return;
  var lid = S.form.lugarId;
  sb.from("visitas").delete().eq("id", S.form.visitaId).then(function(r){
    if (r.error){ toast(traduzErro(r.error)); return; }
    carregarGrupo(S.grupo.id).then(function(){ go("#/g/" + S.grupo.id + "/lugar/" + lid); });
  });
}

/* ---------- ações (delegação de eventos) ---------- */
function marcar(container, btn, multi){
  if (multi) btn.classList.toggle("on");
  else {
    Array.prototype.forEach.call(container.children, function(c){ c.classList.remove("on"); });
    btn.classList.add("on");
  }
}
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var a = el.getAttribute("data-act"), d = el.dataset, g = S.grupo && S.grupo.id;
  switch (a){
    case "auth": return fazerAuth();
    case "authModo": S.authModo = S.authModo === "login" ? "cadastro" : "login"; return viewAuth();
    case "sair": return sb.auth.signOut();
    case "abrirGrupo": return go("#/g/" + d.id);
    case "irGrupos": S._grupoAuto = true; S.grupo = null; return go("#/grupos");
    case "sheetCriar": return sheetCriar();
    case "sheetEntrar": return sheetEntrar();
    case "gTipo": S.sheetTipo = d.v; return marcar($("gTipo"), el, false);
    case "criarGrupo": return criarGrupo();
    case "entrarGrupo":
      var cod = $("gCod").value.trim();
      if (!cod){ $("gErr").textContent = "Digite o código."; return; }
      $("gOk").disabled = true; return entrarGrupo(cod, false);
    case "convidar": return convidar();
    case "copiarConvite":
      if (navigator.clipboard) navigator.clipboard.writeText(S.convite.texto).then(function(){ toast("Convite copiado"); });
      return;
    case "aba": S.aba = d.v; S.cat = ""; return viewLista();
    case "cat": S.cat = d.v; return renderCards();
    case "vista": S.vista = S.vista === "mapa" ? "lista" : "mapa"; lsSet("role_vista", S.vista); return viewLista();
    case "mapaEu": return mapaOndeEstou();
    case "novoLugar": return go("#/g/" + g + "/novo");
    case "abrirLugar": return go("#/g/" + g + "/lugar/" + d.id);
    case "editarLugar": return go("#/g/" + g + "/editar/" + d.id);
    case "voltarLista": return go("#/g/" + g);
    case "voltar": return history.back();
    case "visita": return go("#/g/" + g + "/visita/" + d.l + (d.v ? "/" + d.v : ""));
    case "fSingle":
      var v = d.v, key = d.g;
      S.form[key] = (key === "cb") ? parseInt(v, 10) : v;
      return marcar(el.parentNode, el, false);
    case "fMulti":
      var i = S.form.atributos.indexOf(d.v);
      if (i >= 0) S.form.atributos.splice(i, 1); else S.form.atributos.push(d.v);
      return marcar(el.parentNode, el, true);
    case "usarLoc": return usarLocalizacao();
    case "admin": return go("#/admin");
    case "admFiltro": S.admFiltro = d.v; return viewAdmin();
    case "abrirAdminLocal": return go("#/admin/local/" + d.id);
    case "excluirLocal": return excluirLocalAdmin();
    case "trocarCidade": S.form.editCidade = true; renderEnderecoExtras(); return $("fCidade") && $("fCidade").focus();
    case "usarEndereco": $("fEndereco").value = S.form.endAtual; S.form.endereco = S.form.endAtual;
      $("fNumero").value = S.form.numAtual || ""; S.form.numero = S.form.numAtual || "";
      renderEnderecoExtras(); return agendarGeocode();
    case "fPrivado": S.form.privado = !S.form.privado; return el.classList.toggle("on", S.form.privado);
    case "mesclar": return abrirMesclar();
    case "mesclarPara": return mesclarPara(d.id);
    case "pickLocal": return pickLocal(d.id);
    case "novoLocal": return novoLocal();
    case "voltaBusca": S.form.modo = "busca"; return renderForm() || buscarLocais();
    case "salvarLugar": return salvarLugar();
    case "apagarLugar": return apagarLugar();
    case "salvarVisita": return salvarVisita();
    case "apagarVisita": return apagarVisita();
  }
});

/* ---------- convite por link (?codigo=XXXXXX) ---------- */
(function(){
  try {
    var c = new URLSearchParams(location.search).get("codigo");
    if (c && /^[A-Za-z0-9]{4,12}$/.test(c)){
      lsSet("role_convite", c.toUpperCase());
      history.replaceState(null, "", location.pathname + location.hash);
    }
  } catch(e){}
})();

/* ---------- sessão ---------- */
function iniciar(user){
  S.user = user; S.grupo = null; S._grupoAuto = false;
  var conv = lsGet("role_convite");
  var p = carregarGrupos();
  if (conv){
    lsSet("role_convite", null);
    p = p.then(function(){ return entrarGrupo(conv, true); }).then(function(){ return carregarGrupos(); });
  }
  p.then(function(){
    return sb.from("perfis").select("id,nome").eq("id", user.id).then(function(r){
      if (r.data) r.data.forEach(function(x){ S.perfis[x.id] = x; });
    });
  }).then(function(){
    return sb.from("admins").select("user_id").eq("user_id", user.id).then(function(r){ S.admin = !!(r.data && r.data.length); });
  }).then(function(){
    if (!location.hash || location.hash === "#/" || location.hash === "#"){
      var ultimo = lsGet("role_grupo");
      if (ultimo && S.grupos.some(function(g){ return g.id === ultimo; })) location.hash = "#/g/" + ultimo;
      else if (S.grupos.length === 1) location.hash = "#/g/" + S.grupos[0].id;
      else route();
    } else route();
  }).catch(function(e){ app.innerHTML = '<p class="empty">Erro ao carregar: ' + esc(traduzErro(e)) + '</p>'; });
}
sb.auth.onAuthStateChange(function(evento, session){
  setTimeout(function(){
    if (session && session.user){
      if (!S.user || S.user.id !== session.user.id) iniciar(session.user);
    } else {
      S.user = null; S.admin = false; S.grupo = null; S.grupos = []; S.lugares = [];
      location.hash = ""; viewAuth();
    }
  }, 0);
});
sb.auth.getSession().then(function(r){ if (!r.data.session) viewAuth(); });

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

})();
</script>
