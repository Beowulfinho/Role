<style>

      --line:#383129; --accent:#EE6B40; --accent-ink:#1B120E; --accent-soft:#40231A;
      --good:#6CC48C; --good-soft:#1E3326; --mid:#E2B24A; --mid-soft:#3A2F15; --bad:#EE7E70; --bad-soft:#3F211D;
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior-y:contain;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.4}

  input,textarea,select{font:inherit;color:var(--ink)}
  #app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
  .top h1{font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;min-width:40px;padding:0 10px;font-weight:600;font-size:14px}
  .btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px 18px;font-weight:600;width:100%}
  .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}

  .card.click{cursor:pointer}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--ink-soft);font-size:14px}
  .faint{color:var(--ink-faint);font-size:13px}
  .title{font-weight:600;font-size:17px}
  .stack{display:flex;flex-direction:column;gap:12px}
  label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=url],textarea{
    width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 13px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:80px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

  .stat span{font-size:12.5px;color:var(--ink-soft)}
  .err{color:var(--bad);font-size:14px;min-height:20px}
  .ok{color:var(--good);font-size:14px}
  .center{text-align:center}
  .empty{text-align:center;color:var(--ink-soft);padding:36px 12px}
  .empty .big{font-size:42px;margin-bottom:6px}
  .fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));border:0;background:var(--accent);color:var(--accent-ink);

  .notarow{display:flex;align-items:center;gap:14px}

  .pin{background:none;border:0;font-size:28px;line-height:30px}

  .mk.plan{background:var(--card);color:var(--accent);border:2px solid var(--accent);font-size:15px}
  .eu{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--card);box-shadow:0 0 0 6px rgba(120,120,120,.22)}
  .leaflet-container{background:var(--bg);font-family:Inter,system-ui,sans-serif}
  .leaflet-container .maplibregl-canvas{filter:sepia(.18) saturate(.9)}
  .mapa-escuro .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) sepia(.15) brightness(.88) contrast(.9)}
  .mapa-raster .leaflet-tile-pane{filter:grayscale(.85) contrast(.92) brightness(1.04)}

  .fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .foto{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)}

  .lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:40;display:flex;align-items:center;justify-content:center}
  .lb img{max-width:100%;max-height:100%;object-fit:contain}
  .lbx,.lbn{position:absolute;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:44px;height:44px;font-size:26px;line-height:44px;padding:0}
  .lbx{top:calc(14px + env(safe-area-inset-top));right:14px}
  .lbn{top:50%;transform:translateY(-50%)} .lbp{left:10px} .lbq{right:10px}
  .lbc{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:14px}
  .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
  .badge{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px}
  .menu-bg{position:fixed;inset:0;z-index:25}
  .menu{position:absolute;top:calc(58px + env(safe-area-inset-top));right:max(16px,calc(50% - 264px));min-width:220px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:6px}
  .menu button{display:flex;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;font-size:15px;color:var(--ink)}
  .menu button:active{background:var(--accent-soft)}
  .avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:38px}
  .marca{display:inline-flex;align-items:center;gap:5px;flex:none}
  .marca img{width:28px;height:28px;border-radius:7px;display:block}
  .marca small{font-size:10px;font-weight:600;color:var(--ink-faint);letter-spacing:.02em}
  #ptr{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-10px);width:38px;height:38px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
    font-size:21px;color:var(--ink-soft);opacity:0;z-index:35;pointer-events:none;transition:opacity .12s}
  #ptr.pronto{color:var(--accent);border-color:var(--accent)}
  #ptr span{display:block;line-height:1}
  #ptr.gira span{animation:ptrgira .8s linear infinite}
  @keyframes ptrgira{to{transform:rotate(360deg)}}
  .avatar{overflow:hidden;flex:none}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .nivel{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .nivel-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .barra{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px}
  .barra span{display:block;height:100%;background:var(--accent);border-radius:999px}
  .chip.react{font-size:15px;padding:8px 16px}
  .qr{display:inline-block;width:min(62vw,230px);height:auto;background:#fff;padding:10px;border-radius:14px;image-rendering:pixelated;border:1px solid var(--line)}
  #scan{background:#000}
  #scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scan-quadro{position:relative;width:min(68vw,280px);aspect-ratio:1;border:3px solid #fff;border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .lb img.lb-avatar{width:min(92vw,520px);height:auto;max-height:80vh;border-radius:22px;object-fit:cover}
  .avatar.click{cursor:pointer}
  .rev{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .rev:first-child{border-top:0;padding-top:0;margin-top:0}
</style>

<script>

var CATEGORIAS = [

var S = {
  user: null, grupos: [], grupo: null, membros: [], perfis: {}, lugares: [],
  somenteLeitura: false, amigos: [], sheetAmigos: [], ordem: lsGet("role_ordem") === "data" ? "data" : "nota", authModo: "login", vista: lsGet("role_vista") === "mapa" ? "mapa" : "lista", aba: "ja_fomos", cat: "", busca: "", form: null
};

var app = document.getElementById("app");

/* ---------- utilidades ---------- */
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function $(id){ return document.getElementById(id); }
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k,v); } catch(e){} }
function fmtNota(n){ return n == null ? "–" : (Math.round(n*10)/10).toString().replace(".",","); }
function fmtMoney(n){ return n == null ? "–" : n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtData(d){ var p = String(d).split("-"); return p.length === 3 ? p[2]+"/"+p[1]+"/"+p[0] : d; }
function hoje(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function avg(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : null; }

  var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2600);
}
function traduzErro(e){
  var m = (e && e.message) || String(e || "");
  if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/already registered/i.test(m)) return "Esse e-mail já tem conta. Tente entrar.";
  if (/Password should be/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if (/codigo invalido/i.test(m)) return "Código de convite inválido.";
  if (/Email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar.";
  if (/outro grupo usa/i.test(m)) return "Outro grupo usa este lugar, então não dá para mesclar por aqui.";
  if (/sem permissao/i.test(m)) return "Você não tem permissão para mesclar este lugar.";
  if (/proprio catalogo/i.test(m)) return "Você não pode apoiar o seu próprio catálogo.";
  if (/catalogo nao publico/i.test(m)) return "Este catálogo não é mais público.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Sem conexão com a internet.";
  if (/rate limit/i.test(m)) return "Muitas tentativas. Espere um pouco e tente de novo.";
  return m;
}
function mapsUrl(l){
  // busca pelo nome + endereço (abre a ficha do local no Maps); coordenadas só se não houver nenhum dado de endereço
  var base = "https://www.google.com/maps/search/?api=1&query=";
  var partes = [l.nome, fmtEnd(l), l.bairro, l.cidade].filter(Boolean);
  if (fmtEnd(l) || l.bairro || l.cidade) return base + encodeURIComponent(partes.join(", "));
  if (l.lat != null && l.lng != null) return base + encodeURIComponent(l.nome + " ") + l.lat + "," + l.lng;
  return base + encodeURIComponent(l.nome || "");
}

/* ---------- estatísticas ---------- */
function stats(l){
  if (l._stats) return l._stats;
  var vis = l.visitas || [];
  var avs = []; vis.forEach(function(v){ (v.avaliacoes||[]).forEach(function(a){ avs.push(a); }); });
  var gpp = vis.filter(function(v){ return v.gasto_total != null && v.num_pessoas; })
               .map(function(v){ return Number(v.gasto_total)/v.num_pessoas; });
  var cbs = avs.filter(function(a){ return a.custo_beneficio != null; }).map(function(a){ return a.custo_beneficio; });
  var com = avs.filter(function(a){ return a.voltaria; });
  return {
    nVisitas: vis.length,
    media: avg(avs.map(function(a){ return Number(a.nota); })),
    cb: avg(cbs),
    gastoPP: avg(gpp),
    voltam: com.filter(function(a){ return a.voltaria === "sim"; }).length,
    voltamTotal: com.length,
    nunca: com.some(function(a){ return a.voltaria === "nunca_mais"; })
  };
}

function carregarGrupos(){
  return sb.from("grupo_membros").select("papel, grupos(id,nome,tipo,codigo_convite,publico)").eq("user_id", S.user.id)
    .then(function(r){
      if (r.error) throw r.error;
      S.grupos = (r.data||[]).filter(function(x){ return x.grupos; }).map(function(x){
        return { id:x.grupos.id, nome:x.grupos.nome, tipo:x.grupos.tipo, codigo:x.grupos.codigo_convite, papel:x.papel, publico: !!x.grupos.publico };
      });
      S.grupos.sort(function(a, b){ return (b.tipo === "pessoal") - (a.tipo === "pessoal"); });
    });
}
function carregarGrupo(id){
  var g = S.grupos.filter(function(x){ return x.id === id; })[0];
  if (!g) return Promise.reject(new Error("Grupo não encontrado"));
  S.grupo = g; S.somenteLeitura = false;
  return Promise.all([
    sb.from("lugares").select("*, locais(*), visitas(*, avaliacoes(*), fotos(*))").eq("grupo_id", id).order("created_at",{ascending:false}),
    sb.from("grupo_membros").select("user_id,papel").eq("grupo_id", id),
    sb.from("perfis").select("id,nome,avatar_url")
  ]).then(function(rs){
    rs.forEach(function(r){ if (r.error) throw r.error; });
    S.lugares = (rs[0].data || []).map(function(l){
      var lo = l.locais || {};
      l.nome = lo.nome; l.categoria = lo.categoria; l.bairro = lo.bairro; l.cidade = lo.cidade;
      l.lat = lo.lat; l.lng = lo.lng; l.precisao = lo.precisao; l.local_criado_por = lo.criado_por; l.privado = !!lo.privado; l.endereco = lo.endereco; l.numero = lo.numero;
      return l;
    });
    S.membros = rs[1].data || [];
    S.perfis = {}; (rs[2].data||[]).forEach(function(p){ S.perfis[p.id] = p; });
  });
}

function reduzirQuadrado(img, lado, qualidade){
  var s = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2, out = Math.min(lado, s);
  var c = document.createElement("canvas"); c.width = c.height = out;
  c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, out, out);
  return new Promise(function(res){ c.toBlob(function(b){ res(b); }, "image/jpeg", qualidade); });
}

/* ---------- QR code de amizade ---------- */
var scriptsCarregados = {}, URL_QRGEN = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js", URL_JSQR = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
function carregarScript(url){
  if (scriptsCarregados[url]) return scriptsCarregados[url];
  scriptsCarregados[url] = new Promise(function(res, rej){
    var sc = document.createElement("script"); sc.src = url; sc.onload = function(){ res(); };
    sc.onerror = function(){ delete scriptsCarregados[url]; rej(new Error("Não consegui carregar o leitor de QR code agora.")); };
    document.head.appendChild(sc);
  });
  return scriptsCarregados[url];
}
function desenharQr(texto){
  var box = $("qrBox"); if (!box) return;
  carregarScript(URL_QRGEN).then(function(){
    var qr = qrcode(0, "M"); qr.addData(texto); qr.make();
    if ($("qrBox")) $("qrBox").innerHTML = '<img class="qr" alt="QR code do seu convite de amizade" src="' + qr.createDataURL(6, 2) + '">';
  }).catch(function(){ if ($("qrBox")) $("qrBox").innerHTML = '<div class="faint">Não consegui gerar o QR code agora.</div>'; });
}
var scan = null;
function extrairCodigoAmigo(txt){
  txt = String(txt || "").trim();
  try { var u = new URL(txt), c = u.searchParams.get("amigo"); if (c && /^[A-Za-z0-9]{6,12}$/.test(c)) return c.toUpperCase(); } catch(e){}
  return /^[A-Za-z0-9]{6,12}$/.test(txt) ? txt.toUpperCase() : null;
}
function abrirScanner(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("A câmera não está disponível neste aparelho."); return; }
  fecharScanner();
  var bg = document.createElement("div"); bg.className = "lb"; bg.id = "scan";
  bg.innerHTML = '<video id="scanVideo" playsinline muted></video><div class="scan-quadro"></div>' +
    '<button class="lbx" data-act="scanFechar" aria-label="Fechar">×</button><div class="lbc" id="scanMsg">Aponte a câmera para o QR code do seu amigo</div>';
  document.body.appendChild(bg);
  var st = scan = { parar: false, stream: null };
  Promise.all([ carregarScript(URL_JSQR), navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false }) ]).then(function(r){
    if (st.parar){ r[1].getTracks().forEach(function(t){ t.stop(); }); return; }
    st.stream = r[1];
    var v = $("scanVideo"); v.srcObject = r[1];
    return v.play().then(function(){ lerQuadroQr(st); });
  }).catch(function(e){
    fecharScanner();
    toast(e && /NotAllowed|Permission|denied/i.test((e.name || "") + (e.message || "")) ? "Permita o acesso à câmera para escanear." : ((e && e.message) || "Não consegui abrir a câmera."));
  });
}
function lerQuadroQr(st){
  if (st.parar) return;
  var v = $("scanVideo"); if (!v) return;
  if (v.videoWidth){
    var k = Math.min(1, 480 / v.videoWidth), w = Math.round(v.videoWidth * k), h = Math.round(v.videoHeight * k);
    var c = st.canvas || (st.canvas = document.createElement("canvas")); c.width = w; c.height = h;
    var g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(v, 0, 0, w, h);
    var q = window.jsQR && jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
    if (q && q.data){
      var cod = extrairCodigoAmigo(q.data);
      if (cod){ fecharScanner(); adicionarPorCodigo(cod); return; }
      var m = $("scanMsg"); if (m) m.textContent = "Esse QR code não é de um amigo do Rolê.";
    }
  }
  setTimeout(function(){ lerQuadroQr(st); }, 120);
}
function fecharScanner(){
  if (scan){ scan.parar = true; if (scan.stream) scan.stream.getTracks().forEach(function(t){ t.stop(); }); scan = null; }
  var b = $("scan"); if (b) b.remove();
}

      : r.data === "pendente" ? "Pedido de amizade enviado." : "Agora vocês são amigos no Rolê!");

/* ---------- base de mapa minimalista (CARTO claro/escuro, sem chave) ---------- */
function criarMapa(el, centro, zoom){
  var m = L.map(el, { zoomControl: false, attributionControl: false }).setView(centro, zoom);
  var escuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var cont = m.getContainer(); if (escuro) cont.classList.add("mapa-escuro");
  var base = "© OpenStreetMap";
  if (window.maplibregl && L.maplibreGL){
    // estilo vetorial minimalista e gratuito (OpenFreeMap), sem chave de API
    L.maplibreGL({ style: "https://tiles.openfreemap.org/styles/positron" }).addTo(m);
    base = "OpenFreeMap © OpenMapTiles, dados © OpenStreetMap";
  } else {
    cont.classList.add("mapa-raster");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(m);
  }
  L.control.attribution({ prefix: false }).addAttribution(base).addTo(m);
  return m;
}

/* ---------- formulário de lugar (catálogo comunitário) ---------- */
var GEO = { lat: null, lng: null, estado: "idle" };
var buscaSeq = 0, buscaTimer = null;

function pedirLocalizacao(depois){
  if (!navigator.geolocation){ GEO.estado = "negado"; atualizarStatusLoc(); if (depois) depois(); return; }
  GEO.estado = "buscando"; atualizarStatusLoc();
  navigator.geolocation.getCurrentPosition(function(p){
    GEO.lat = p.coords.latitude; GEO.lng = p.coords.longitude; GEO.estado = "ok";
    lsSet("role_ultimo", JSON.stringify([GEO.lat, GEO.lng]));
    atualizarStatusLoc(); if (depois) depois();
  }, function(){
    GEO.estado = "negado"; atualizarStatusLoc(); if (depois) depois();
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}
function atualizarStatusLoc(){
  var el = $("locStatus"); if (!el) return;
  el.textContent = GEO.estado === "ok" ? "📍 Usando sua localização atual"
    : GEO.estado === "buscando" ? "Localizando…"
    : GEO.estado === "negado" ? "Sem localização. Busque pelo nome." : "";
}

/* geocodificação gratuita (Nominatim/OpenStreetMap): cidade pela localização atual e coordenadas pelo endereço */
var revCache = {};
function fetchComTimeout(url, ms){
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var t = setTimeout(function(){ if (ctl) ctl.abort(); }, ms);
  return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function(r){ clearTimeout(t); return r; }, function(e){ clearTimeout(t); throw e; });
}
function geocodeReverso(lat, lng){
  var k = lat.toFixed(4) + "," + lng.toFixed(4);
  if (revCache[k]) return Promise.resolve(revCache[k]);
  return fetchComTimeout("https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=pt-BR&lat=" + lat + "&lon=" + lng, 7000)
    .then(function(r){ return r.json(); }).then(function(j){
      var a = (j && j.address) || {};
      var o = { cidade: a.city || a.town || a.village || a.municipality || a.county || "",
        bairro: a.suburb || a.neighbourhood || a.city_district || "", rua: a.road || "", numero: a.house_number || "" };
      revCache[k] = o; return o;
    }).catch(function(){ return null; });
}
function geocodeEndereco(endereco, cidade){
  var q = [endereco, cidade].filter(Boolean).join(", ");
  return fetchComTimeout("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&accept-language=pt-BR&q=" + encodeURIComponent(q), 7000)
    .then(function(r){ return r.json(); }).then(function(a){
      if (!a || !a[0]) return null;
      var ad = a[0].address || {};
      return { lat: parseFloat(a[0].lat), lng: parseFloat(a[0].lon),
        cidade: ad.city || ad.town || ad.village || ad.municipality || ad.county || "" };
    }).catch(function(){ return null; });
}
function distM(lat1, lng1, lat2, lng2){
  var R = 6371000, rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(x));
}

function queryEnd(rua, numero){
  rua = (rua || "").trim(); numero = (numero || "").trim();
  return rua ? rua + (numero ? ", " + numero : "") : "";
}
function fmtEnd(x){ return queryEnd(x.endereco, x.numero); }
var geoTimer = null;
function agendarGeocode(){ clearTimeout(geoTimer); geoTimer = setTimeout(geocodificarForm, 900); }
function geocodificarForm(){
  var f = S.form;
  if (!f || (f.modo !== "novo" && f.modo !== "editar" && f.modo !== "admin")) return Promise.resolve();
  var cidade = (($("fCidade") ? $("fCidade").value : f.cidade) || "").trim();
  var q = queryEnd(f.endereco, f.numero);
  if (!q || !cidade || q === f.geoQuery) return Promise.resolve();
  f.geoQuery = q;
  var hint = $("mapHint"); if (hint) hint.textContent = "Procurando no mapa…";
  return geocodeEndereco(q, cidade).then(function(g){
    if (S.form !== f) return;
    if (g && g.cidade){
      var a = norm(g.cidade), b = norm(cidade);
      if (a !== b && a.indexOf(b) < 0 && b.indexOf(a) < 0) g = null;
    }
    if (!g){ if (hint) hint.textContent = "Não achei esse endereço em " + cidade + ". Confira a grafia da rua ou arraste o pin até o lugar certo."; return; }
    if (hint) hint.textContent = "Confira o pin e arraste se precisar ajustar.";
    if (f.precisao === "gps" && f.lat != null && distM(f.lat, f.lng, g.lat, g.lng) <= 300) return;
    if (S.map) colocarPin(g.lat, g.lng, "endereco"); else { f.lat = g.lat; f.lng = g.lng; f.precisao = "endereco"; }
  });
}

/* busca no catálogo do próprio grupo: nome parecido ou perto de mim */
function buscarLocais(){
  var f = S.form; if (!f || f.modo !== "busca" || !$("fNome")) return;
  var texto = $("fNome").value.trim(), q = norm(texto);
  f.nome = texto;
  var achados = S.lugares.map(function(l){
    var n = norm(l.nome);
    return { l: l, d: (GEO.lat != null && l.lat != null) ? distM(GEO.lat, GEO.lng, l.lat, l.lng) : null,
      nome: q.length >= 2 && (n.indexOf(q) >= 0 || q.indexOf(n) >= 0) };
  }).filter(function(x){ return x.nome || (x.d != null && x.d <= 150); });
  achados.sort(function(a, b){
    if (a.nome !== b.nome) return a.nome ? -1 : 1;
    return (a.d == null ? 1e9 : a.d) - (b.d == null ? 1e9 : b.d);
  });
  f.sugs = achados.slice(0, 6).map(function(x){
    return { id: x.l.id, nome: x.l.nome, categoria: x.l.categoria, bairro: x.l.bairro, cidade: x.l.cidade,

/* mapa para marcar/ajustar o pin (OpenStreetMap + Leaflet) */
function montarMapa(){
  var el = $("mapa"), f = S.form;
  if (!window.L){ el.innerHTML = '<p class="faint" style="padding:12px">Mapa indisponível agora. Você pode salvar sem localização.</p>'; return; }
  var centro, zoom = 16, u = null;
  try { u = JSON.parse(lsGet("role_ultimo") || "null"); } catch(e){}
  if (f.lat != null) centro = [f.lat, f.lng];
  else if (GEO.lat != null) centro = [GEO.lat, GEO.lng];
  else if (u) centro = u;
  else { centro = [-14.2, -51.9]; zoom = 4; }
  S.map = criarMapa(el, centro, f.lat != null ? 17 : zoom);
  S.map.on("click", function(e){ colocarPin(e.latlng.lat, e.latlng.lng, "ajustada"); });
  if (f.lat != null) colocarPin(f.lat, f.lng, f.precisao, true);
  atualizarMapStatus();
}
function colocarPin(lat, lng, prec, semCentrar){
  var f = S.form; if (!S.map) return;
  f.lat = lat; f.lng = lng; f.precisao = prec;
  if (!S.pin){
    S.pin = L.marker([lat, lng], { draggable: true, icon: L.divIcon({ html: '<div class="mk" style="width:26px;height:26px"></div>', className: "mkwrap", iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(S.map);
    S.pin.on("dragend", function(){ var p = S.pin.getLatLng(); colocarPin(p.lat, p.lng, "ajustada", true); });
  } else S.pin.setLatLng([lat, lng]);
  if (!semCentrar) S.map.setView([lat, lng], Math.max(S.map.getZoom(), 17));
  atualizarMapStatus();
}
function atualizarMapStatus(){
  var el = $("mapStatus"), f = S.form; if (!el) return;
  el.textContent = f.lat == null ? "Sem localização marcada" : f.precisao === "gps" ? "📍 Marcado pelo GPS" : f.precisao === "endereco" ? "📍 Marcado pelo endereço" : "📍 Marcado por você";
}

function salvarLugar(){

  var novo = f.modo !== "editar";

  // o endereço digitado refina a posição quando o GPS não bate (ex.: cadastrou de casa) ou não existe

      lat: f.lat, lng: f.lng, precisao: f.lat == null ? "desconhecida" : f.precisao };

      });

function apagarLugar(){
  var l = lugarPorId(S.form.id);
  if (!confirm("Remover \"" + l.nome + "\" do catálogo? As visitas e avaliações deste lugar serão apagadas. Isso não dá para desfazer.")) return;

/* ---------- fotos dos rolês ---------- */
var FOTOS_MAX = 10, urlCache = {};
function pathThumb(c){ return c.replace(/\.jpg$/, "_t.jpg"); }
function ordenarFotos(v){ return (v.fotos || []).slice().sort(function(a, b){ return a.created_at < b.created_at ? -1 : 1; }); }
function urlsAssinadas(caminhos, bucket){
  bucket = bucket || "fotos";
  var agora = Date.now(), chave = function(c){ return bucket + "|" + c; };
  var faltam = caminhos.filter(function(c, i){ return caminhos.indexOf(c) === i && (!urlCache[chave(c)] || urlCache[chave(c)].exp < agora); });
  var p = faltam.length ? sb.storage.from(bucket).createSignedUrls(faltam, 3600).then(function(r){
    if (r.error) throw r.error;
    (r.data || []).forEach(function(x){ if (x.signedUrl) urlCache[chave(x.path)] = { url: x.signedUrl, exp: agora + 50 * 60 * 1000 }; });
  }) : Promise.resolve();
  return p.then(function(){
    var o = {}; caminhos.forEach(function(c){ if (urlCache[chave(c)]) o[c] = urlCache[chave(c)].url; });
    return o;
  });
}
function carregarImagens(raiz){
  if (!raiz) return;
  var imgs = Array.prototype.slice.call(raiz.querySelectorAll("img[data-path]"));
  if (!imgs.length) return;
  var porBucket = {};
  imgs.forEach(function(i){ var b = i.getAttribute("data-bucket") || "fotos"; (porBucket[b] = porBucket[b] || []).push(i); });
  Object.keys(porBucket).forEach(function(b){
    urlsAssinadas(porBucket[b].map(function(i){ return i.getAttribute("data-path"); }), b).then(function(m){
      porBucket[b].forEach(function(i){ var u = m[i.getAttribute("data-path")]; if (u) i.src = u; });
    }).catch(function(){});
  });
}
function lerImagem(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){ URL.revokeObjectURL(url); res(img); };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("Não consegui ler essa foto.")); };
    img.src = url;
  });
}
function reduzir(img, max, qualidade){
  var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  var c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(function(res){ c.toBlob(function(b){ res(b); }, "image/jpeg", qualidade); });
}
function prepararFoto(file){
  return lerImagem(file).then(function(img){ return Promise.all([reduzir(img, 1600, 0.82), reduzir(img, 400, 0.7)]); })
    .then(function(b){
      if (!b[0] || !b[1]) throw new Error("Não consegui preparar essa foto.");
      return { full: b[0], thumb: b[1], preview: URL.createObjectURL(b[1]) };
    });
}
function caminhosDoLugar(l){
  var o = []; (l.visitas || []).forEach(function(v){ (v.fotos || []).forEach(function(f){ o.push(f.caminho); }); });
  return o;
}
function removerFotosStorage(caminhos){
  if (!caminhos.length) return Promise.resolve();
  return sb.storage.from("fotos").remove(caminhos.concat(caminhos.map(pathThumb))).then(function(){}, function(){});
}
function stripFotos(v){
  var fs = ordenarFotos(v);
  if (!fs.length) return "";
  return '<div class="strip">' + fs.map(function(ft, i){
    return '<img data-path="' + esc(pathThumb(ft.caminho)) + '" data-act="abrirFoto" data-v="' + esc(v.id) + '" data-i="' + i + '" alt="">';
  }).join("") + '</div>';
}
function abrirFoto(visitaId, idx){
  var v = null;
  S.lugares.forEach(function(l){ (l.visitas || []).forEach(function(x){ if (x.id === visitaId) v = x; }); });
  if (!v || !(v.fotos || []).length) return;
  S.lb = { caminhos: ordenarFotos(v).map(function(x){ return x.caminho; }), i: idx };
  var bg = document.createElement("div"); bg.className = "lb"; bg.id = "lb";
  bg.innerHTML = '<img id="lbImg" alt=""><button class="lbx" data-act="fotoFechar" aria-label="Fechar">×</button>' +
    (S.lb.caminhos.length > 1 ? '<button class="lbn lbp" data-act="fotoPrev" aria-label="Anterior">‹</button><button class="lbn lbq" data-act="fotoNext" aria-label="Próxima">›</button>' : '') +
    '<div class="lbc" id="lbCont"></div>';
  bg.addEventListener("click", function(e){ if (e.target === bg) fecharFoto(); });
  document.body.appendChild(bg);
  mostrarFoto();
}
function mostrarFoto(){
  var lb = S.lb; if (!lb || !$("lbImg")) return;
  var c = lb.caminhos[lb.i];
  $("lbCont").textContent = (lb.i + 1) + " / " + lb.caminhos.length;
  urlsAssinadas([c]).then(function(m){ if (S.lb === lb && m[c] && $("lbImg")) $("lbImg").src = m[c]; }).catch(function(){});
}
function fecharFoto(){ var b = $("lb"); if (b) b.remove(); S.lb = null; }
function renderFotosForm(){
  var f = S.form, box = $("fotosBox"); if (!box) return;
  var h = "";
  f.fotosExist.forEach(function(ft){
    h += '<div class="foto"><img data-path="' + esc(pathThumb(ft.caminho)) + '" alt="">' +
      (ft.criado_por === S.user.id ? '<button type="button" data-act="fotoRemoverExist" data-id="' + esc(ft.id) + '" aria-label="Remover foto">×</button>' : '') + '</div>';
  });
  f.fotosNovas.forEach(function(ft, i){
    h += '<div class="foto"><img src="' + esc(ft.preview) + '" alt=""><button type="button" data-act="fotoRemoverNova" data-i="' + i + '" aria-label="Remover foto">×</button></div>';
  });
  box.innerHTML = h || '<div class="faint" style="grid-column:1/-1">Nenhuma foto ainda.</div>';
  carregarImagens(box);
}
function adicionarFotos(files){
  var f = S.form, seq = Promise.resolve();
  Array.prototype.slice.call(files || []).forEach(function(file){
    seq = seq.then(function(){
      if (f.fotosExist.length + f.fotosNovas.length >= FOTOS_MAX){ toast("Máximo de " + FOTOS_MAX + " fotos por rolê."); return; }
      return prepararFoto(file).then(function(ft){ if (S.form === f){ f.fotosNovas.push(ft); renderFotosForm(); } })
        .catch(function(e){ toast(e.message || "Não consegui ler essa foto."); });
    });
  });
}
// remove as fotos marcadas e envia as novas; devolve quantas falharam
function sincronizarFotos(f, visitaId, btn){
  var falhas = 0, base = S.grupo.id + "/" + visitaId + "/", pRem = Promise.resolve();
  if (f.fotosRemover.length){
    pRem = sb.from("fotos").delete().in("id", f.fotosRemover.map(function(x){ return x.id; })).select().then(function(r){
      var ok = (r.data || []).map(function(x){ return x.caminho; });
      return removerFotosStorage(ok);
    });
  }
  return pRem.then(function(){
    var seq = Promise.resolve(), n = f.fotosNovas.length;
    f.fotosNovas.forEach(function(ft, i){
      seq = seq.then(function(){
        btn.textContent = "Enviando fotos " + (i + 1) + "/" + n + "…";
        var nome = window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + i);
        var caminho = base + nome + ".jpg";
        return sb.storage.from("fotos").upload(caminho, ft.full, { contentType: "image/jpeg" }).then(function(r){
          if (r.error) throw r.error;
          return sb.storage.from("fotos").upload(pathThumb(caminho), ft.thumb, { contentType: "image/jpeg" });
        }).then(function(r){
          if (r.error) throw r.error;
          return sb.from("fotos").insert({ visita_id: visitaId, caminho: caminho });
        }).then(function(r){ if (r.error) throw r.error; }).catch(function(){ falhas++; });
      });
    });
    return seq;
  }).then(function(){ return falhas; });
}

/* ---------- formulário do rolê (visita + avaliação + fotos) ---------- */

  if (!l) return go("#/g/" + S.grupo.id);
  var v = visitaId ? (l.visitas||[]).filter(function(x){ return x.id === visitaId; })[0] : null;
  if (visitaId && !v) return go("#/g/" + S.grupo.id + "/lugar/" + lugarId);
  var minha = v ? (v.avaliacoes||[]).filter(function(a){ return a.user_id === S.user.id; })[0] : null;
  S.form = {
    lugarId: lugarId, visitaId: visitaId,
    cb: minha ? minha.custo_beneficio : null, voltaria: minha ? minha.voltaria : null,
    delivery: v ? !!v.delivery : false,

  };
  var nota = minha ? Number(minha.nota) : 8;
  var h = '<div class="top"><button class="iconbtn" data-act="voltar">‹</button><h1>' + (v ? "Editar rolê" : "Novo rolê") + '</h1></div><div class="stack">' +
    '<div class="card" style="margin:0"><div class="title">' + esc(l.nome) + '</div><div class="muted">' + resumoLocal(l) + '</div>' +
      (fmtEnd(l) ? '<div class="faint">' + esc(fmtEnd(l)) + '</div>' : '') + '</div>' +
    '<div class="row"><div class="grow"><label class="f" for="vData">Data do rolê</label><input type="date" id="vData" max="' + hoje() + '" value="' + esc(v ? v.data : hoje()) + '"></div>' +
      '<div class="grow"><label class="f" for="vPessoas">Pessoas</label><input type="number" id="vPessoas" min="1" max="99" inputmode="numeric" value="' + (v && v.num_pessoas ? v.num_pessoas : (S.membros.length || 2)) + '"></div></div>' +
    '<div><label class="f">Como foi?</label><div class="chips" id="gDelivery">' +
      '<button type="button" class="chip ' + (!S.form.delivery ? "on" : "") + '" data-act="fSingle" data-g="delivery" data-v="false">🍽️ Presencial</button>' +
      '<button type="button" class="chip ' + (S.form.delivery ? "on" : "") + '" data-act="fSingle" data-g="delivery" data-v="true">🛵 Delivery</button></div></div>' +
    '<div><label class="f" for="vGasto">Quanto gastaram no total (R$)</label><input type="number" id="vGasto" min="0" step="0.01" inputmode="decimal" placeholder="Opcional" value="' + (v && v.gasto_total != null ? v.gasto_total : "") + '"></div>' +
    '<div><label class="f">Fotos</label><div class="fotos-grid" id="fotosBox"></div>' +

      [1,2,3,4,5].map(function(n){ return '<button class="chip ' + (S.form.cb === n ? "on" : "") + '" data-act="fSingle" data-g="cb" data-v="' + n + '">' + n + ' · ' + esc(CB_LABEL[n]) + '</button>'; }).join("") + '</div></div>' +

function salvarVisita(){
  var f = S.form, l = lugarPorId(f.lugarId);
  var data = $("vData").value, gasto = $("vGasto").value, pessoas = $("vPessoas").value;
  if (!data){ $("fErr").textContent = "Escolha a data."; return; }
  var vis = {
    data: data,
    gasto_total: gasto === "" ? null : Number(gasto),
    num_pessoas: pessoas === "" ? null : parseInt(pessoas, 10),
    delivery: !!f.delivery
  };
  var av = {
    nota: Number($("vNota").value), custo_beneficio: f.cb || null, voltaria: f.voltaria || null,
    pedidos: $("vPedidos").value.trim() || null, comentario: $("vCom").value.trim() || null
  };
  var btn = $("fOk"); btn.disabled = true; btn.textContent = "Salvando…"; $("fErr").textContent = "";
  var novo = !f.visitaId, falhas = 0;
  var pVisita = f.visitaId
    ? sb.from("visitas").update(vis).eq("id", f.visitaId).select().single()
    : sb.from("visitas").insert(Object.assign({ lugar_id: f.lugarId }, vis)).select().single();
  pVisita.then(function(r){
    if (r.error) throw r.error;
    f.visitaId = r.data.id;
    av.visita_id = r.data.id; av.user_id = S.user.id;
    return sb.from("avaliacoes").upsert(av, { onConflict: "visita_id,user_id" });
  }).then(function(r){
    if (r.error) throw r.error;
    return l.estado === "ja_fomos" ? null : sb.from("lugares").update({ estado: "ja_fomos" }).eq("id", f.lugarId);
  }).then(function(){
    return sincronizarFotos(f, f.visitaId, btn);
  }).then(function(n){
    falhas = n;
    return carregarGrupo(S.grupo.id);
  }).then(function(){
    if (falhas) toast(falhas === 1 ? "Uma foto não foi enviada. Edite o rolê para tentar de novo." : falhas + " fotos não foram enviadas. Edite o rolê para tentar de novo.");
    if (novo){ S.aba = "ja_fomos"; go("#/g/" + S.grupo.id); }
    else go("#/g/" + S.grupo.id + "/lugar/" + f.lugarId);
  }).catch(function(e){
    btn.disabled = false; btn.textContent = "Salvar rolê"; $("fErr").textContent = traduzErro(e);
  });
}
function apagarVisita(){
  if (!confirm("Apagar este rolê, as avaliações e as fotos dele? Isso não dá para desfazer.")) return;
  var lid = S.form.lugarId, l = lugarPorId(lid);
  var v = (l.visitas || []).filter(function(x){ return x.id === S.form.visitaId; })[0];
  var caminhos = v ? (v.fotos || []).map(function(x){ return x.caminho; }) : [];
  sb.from("visitas").delete().eq("id", S.form.visitaId).then(function(r){
    if (r.error){ toast(traduzErro(r.error)); return; }
    removerFotosStorage(caminhos);
    carregarGrupo(S.grupo.id).then(function(){ go("#/g/" + S.grupo.id + "/lugar/" + lid); });
  });
}

/* ---------- ações (delegação de eventos) ---------- */
function marcar(container, btn, multi){
  if (multi) btn.classList.toggle("on");
  else {
    Array.prototype.forEach.call(container.children, function(c){ c.classList.remove("on"); });
    btn.classList.add("on");
  }
}
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var a = el.getAttribute("data-act"), d = el.dataset, g = S.grupo && S.grupo.id;
  if (el.closest("#menuPop")) fecharMenu();

    case "auth": return fazerAuth();
    case "authModo": S.authModo = S.authModo === "login" ? "cadastro" : "login"; return viewAuth();
    case "sair": return sb.auth.signOut();
    case "abrirGrupo": return go("#/g/" + d.id);
    case "irGrupos": S._grupoAuto = true; S.grupo = null; S.somenteLeitura = false; return go("#/grupos");
    case "sheetCriar": return sheetCriar();
    case "sheetEntrar": return sheetEntrar();
    case "gTipo": S.sheetTipo = d.v; return marcar($("gTipo"), el, false);
    case "criarGrupo": return criarGrupo();
    case "entrarGrupo":
      var cod = $("gCod").value.trim();
      if (!cod){ $("gErr").textContent = "Digite o código."; return; }

    case "convidar": return convidar();
    case "copiarConvite":
      if (navigator.clipboard) navigator.clipboard.writeText(S.convite.texto).then(function(){ toast("Convite copiado"); });
      return;
    case "aba": S.aba = d.v; S.cat = ""; return viewLista();
    case "cat": S.cat = d.v; return renderCards();
    case "vista": S.vista = S.vista === "mapa" ? "lista" : "mapa"; lsSet("role_vista", S.vista); return viewLista();
    case "mapaEu": return mapaOndeEstou();
    case "ordem": S.ordem = d.v; lsSet("role_ordem", S.ordem); return renderCards();
    case "novoLugar": return go("#/g/" + g + "/novo");
    case "abrirLugar": if (S.somenteLeitura) return sheetLugarPublico(d.id); return go("#/g/" + g + "/lugar/" + d.id);
    case "editarLugar": return go("#/g/" + g + "/editar/" + d.id);
    case "voltarLista": return go("#/g/" + g);
    case "voltar": return history.back();
    case "visita": return go("#/g/" + g + "/visita/" + d.l + (d.v ? "/" + d.v : ""));
    case "fSingle":
      var v = d.v, key = d.g;
      S.form[key] = (key === "cb") ? parseInt(v, 10) : (key === "delivery") ? v === "true" : v;
      return marcar(el.parentNode, el, false);
    case "fMulti":
      var i = S.form.atributos.indexOf(d.v);
      if (i >= 0) S.form.atributos.splice(i, 1); else S.form.atributos.push(d.v);

    case "usarLoc": return usarLocalizacao();

    case "fotoRemoverNova":

      });
      return renderFotosForm();
    case "abrirFoto": return abrirFoto(d.v, parseInt(d.i, 10));

    case "fotoPrev": S.lb.i = (S.lb.i + S.lb.caminhos.length - 1) % S.lb.caminhos.length; return mostrarFoto();
    case "fotoNext": S.lb.i = (S.lb.i + 1) % S.lb.caminhos.length; return mostrarFoto();
    case "irAmigos": return go("#/amigos");
    case "menu": return abrirMenu();
    case "irPerfil": return go("#/perfil");

    case "salvarPerfil": return salvarPerfil();

    case "pLoc": return perfilUsarLocalizacao();

    case "abrirAvatar": return abrirAvatar(d.path);
    case "integrantes": return abrirIntegrantes();
    case "scanAbrir": return abrirScanner();
    case "scanFechar": return fecharScanner();
    case "abrirPublico": return go("#/publico/" + d.id);
    case "reagir": return reagir(d.t);
    case "copiarLinkAmigo":
      if (navigator.clipboard) navigator.clipboard.writeText(S.linkAmigo).then(function(){ toast("Link copiado"); });
      return;
    case "adicionarAmigo": return adicionarAmigo();

      var ix = S.sheetAmigos.indexOf(d.u);
      if (ix >= 0) S.sheetAmigos.splice(ix, 1); else S.sheetAmigos.push(d.u);

    case "usarEndereco": $("fEndereco").value = S.form.endAtual; S.form.endereco = S.form.endAtual;
      $("fNumero").value = S.form.numAtual || ""; S.form.numero = S.form.numAtual || "";
      renderEnderecoExtras(); return agendarGeocode();

    case "apagarLugar": return apagarLugar();
    case "salvarVisita": return salvarVisita();
    case "apagarVisita": return apagarVisita();
  }
});

/* ---------- puxar para recarregar ---------- */
function recarregarApp(){ location.reload(); }
(function(){
  var LIMITE = 80, y0 = null, puxando = false, dist = 0, carregando = false;
  var ind = document.createElement("div");
  ind.id = "ptr"; ind.innerHTML = "<span>↻</span>"; document.body.appendChild(ind);
  function esconder(){ ind.style.opacity = "0"; ind.style.transform = "translate(-50%, -10px)"; ind.classList.remove("pronto"); }
  function bloqueado(alvo){
    if (carregando) return true;
    if ((window.scrollY || 0) > 0 || (document.scrollingElement && document.scrollingElement.scrollTop > 0)) return true;
    if ($("sheet") || $("lb") || $("menuPop") || $("scan")) return true;
    if (/\/(novo|editar|visita)(\/|$)/.test(location.hash)) return true;   // não perder o que está sendo digitado
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
    return !!(alvo && alvo.closest && alvo.closest(".leaflet-container, input, textarea, select"));
  }
  document.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1 || bloqueado(e.target)){ y0 = null; return; }
    y0 = e.touches[0].clientY; puxando = false; dist = 0;
  }, { passive: true });
  document.addEventListener("touchmove", function(e){
    if (y0 == null) return;
    var d = e.touches[0].clientY - y0;
    if (d <= 0 || (window.scrollY || 0) > 0){ if (puxando) esconder(); puxando = false; if (d <= 0) return; y0 = null; return; }
    puxando = true; dist = d;
    ind.style.opacity = String(Math.min(1, d / LIMITE));
    ind.style.transform = "translate(-50%, " + Math.min(70, d / 2.2) + "px) rotate(" + Math.round(d * 3) + "deg)";
    ind.classList.toggle("pronto", d >= LIMITE);
  }, { passive: true });
  document.addEventListener("touchend", function(){
    if (y0 == null) return;
    y0 = null;
    if (puxando && dist >= LIMITE){
      carregando = true; ind.classList.add("gira"); ind.style.opacity = "1"; ind.style.transform = "translate(-50%, 56px)";
      setTimeout(recarregarApp, 250);
    } else esconder();
    puxando = false;
  }, { passive: true });
})();

/* ---------- convite por link (?codigo=XXXXXX) ---------- */
(function(){
  try {
    var c = new URLSearchParams(location.search).get("codigo");
    if (c && /^[A-Za-z0-9]{4,12}$/.test(c)){
      lsSet("role_convite", c.toUpperCase());
      history.replaceState(null, "", location.pathname + location.hash);
    }
    var am = new URLSearchParams(location.search).get("amigo");
    if (am && /^[A-Za-z0-9]{6,12}$/.test(am)){
      lsSet("role_amigo", am.toUpperCase());
      history.replaceState(null, "", location.pathname + location.hash);
    }
    var pb = new URLSearchParams(location.search).get("publico");
    if (pb && /^[0-9a-f-]{36}$/i.test(pb)){
      lsSet("role_publico", pb.toLowerCase());
      history.replaceState(null, "", location.pathname + location.hash);
    }
  } catch(e){}
})();

/* ---------- sessão ---------- */
function iniciar(user){
  S.user = user; S.grupo = null; S._grupoAuto = false;
  var conv = lsGet("role_convite");
  var p = sb.rpc("garantir_catalogo_pessoal").then(function(){}, function(){}).then(function(){ return carregarGrupos(); });
  if (conv){
    lsSet("role_convite", null);
    p = p.then(function(){ return entrarGrupo(conv, true); }).then(function(){ return carregarGrupos(); });
  }
  p.then(function(){
    return sb.from("perfis").select("id,nome,avatar_url,cidade,bairro").eq("id", user.id).then(function(r){
      if (r.data) r.data.forEach(function(x){ S.perfis[x.id] = x; });
    });
  }).then(function(){
    return carregarAmigos().then(function(){}, function(){});
  }).then(function(){
    var am = lsGet("role_amigo");
    if (am){
      lsSet("role_amigo", null);
      return sb.rpc("adicionar_amigo", { p_codigo: am }).then(function(r){
        toast(r.error ? (/proprio/.test(r.error.message) ? "Esse é o seu próprio código." : "Código de amigo inválido.")
          : r.data === "aceita" ? "Agora vocês são amigos no Rolê!" : "Pedido de amizade enviado.");
        return carregarAmigos().then(function(){}, function(){});
      }).then(function(){ go("#/amigos"); });
    }
    var pub = lsGet("role_publico");
    if (pub){ lsSet("role_publico", null); location.hash = "#/publico/" + pub; return; }
    S._grupoAuto = true;   // a página inicial é sempre "Seus grupos"
    route();
  }).catch(function(e){ app.innerHTML = '<p class="empty">Erro ao carregar: ' + esc(traduzErro(e)) + '</p>'; });
}
sb.auth.onAuthStateChange(function(evento, session){
  setTimeout(function(){
    if (session && session.user){
      if (!S.user || S.user.id !== session.user.id) iniciar(session.user);
    } else {
      S.user = null; S.grupo = null; S.somenteLeitura = false; S.amigos = []; S.grupos = []; S.lugares = [];
      location.hash = ""; viewAuth();
    }
  }, 0);
});
sb.auth.getSession().then(function(r){ if (!r.data.session) viewAuth(); });

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

})();
